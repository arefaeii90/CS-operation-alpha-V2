<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Alpha – Manager Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
  :root {
    --dhl-yellow:#FFCC00;--dhl-red:#D40511;--cod-dark:#0A0A0A;--cod-mid:#141414;
    --cod-panel:#1A1A1A;--cod-border:#2A2A2A;--text-main:#F0F0F0;--text-muted:#888;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cod-dark);font-family:'Rajdhani',sans-serif;color:var(--text-main);min-height:100vh;
    background-image:radial-gradient(ellipse at 10% 20%,rgba(212,5,17,.08) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(255,204,0,.06) 0%,transparent 50%);}
  header{background:linear-gradient(135deg,#0D0D0D 0%,#1A0A00 50%,#0D0D0D 100%);border-bottom:2px solid var(--dhl-yellow);
    padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(255,204,0,.15);}
  .dhl-badge{background:var(--dhl-red);color:var(--dhl-yellow);font-family:'Orbitron',monospace;font-weight:900;font-size:14px;
    padding:6px 12px;letter-spacing:2px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
  .op-title{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--dhl-yellow);text-shadow:0 0 20px rgba(255,204,0,.5);letter-spacing:3px;}
  .op-subtitle{font-size:11px;color:var(--text-muted);letter-spacing:4px;text-transform:uppercase;margin-top:2px;}
  .mission-status{font-size:11px;color:#39FF14;letter-spacing:3px;text-transform:uppercase;}
  .mission-status::before{content:'● ';animation:blink 1.5s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .gif-hero{width:100%;max-height:340px;overflow:hidden;position:relative;border-bottom:3px solid var(--dhl-yellow);}
  .gif-hero img{width:100%;height:340px;object-fit:cover;object-position:center top;display:block;}
  .gif-hero-overlay{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to top,var(--cod-dark),transparent);}
  .gif-hero-tag{position:absolute;top:16px;right:20px;background:rgba(0,0,0,.7);border:1px solid var(--dhl-yellow);
    color:var(--dhl-yellow);font-family:'Orbitron',monospace;font-size:10px;font-weight:700;padding:5px 10px;letter-spacing:2px;}
  main{padding:24px 28px;max-width:1400px;margin:0 auto;}
  .section-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--dhl-yellow);letter-spacing:4px;
    text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--dhl-yellow),transparent);}
  .squads-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:32px;}
  .squad-card{background:var(--cod-panel);border:1px solid var(--cod-border);position:relative;overflow:hidden;transition:border-color .3s;}
  .squad-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--squad-color);box-shadow:0 0 12px var(--squad-color);}
  .squad-card:hover{border-color:var(--squad-color);}
  .squad-header{background:rgba(0,0,0,.4);padding:14px 18px 14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--cod-border);}
  .squad-label{font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;}
  .squad-name{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--squad-color);text-shadow:0 0 10px var(--squad-color);}
  .squad-motto{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:2px;}
  .squad-rank-badge{text-align:center;background:rgba(0,0,0,.5);border:1px solid var(--squad-color);padding:8px 14px;min-width:90px;}
  .rank-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .rank-name{font-family:'Orbitron',monospace;font-size:11px;color:var(--squad-color);font-weight:700;}
  .squad-xp-area{padding:16px 18px 16px 24px;border-bottom:1px solid var(--cod-border);}
  .xp-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .xp-total{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:var(--squad-color);line-height:1;}
  .xp-unit{font-size:13px;color:var(--text-muted);margin-left:4px;}
  .xp-next{font-size:11px;color:var(--text-muted);}
  .xp-bar-bg{height:6px;background:rgba(255,255,255,.08);overflow:hidden;}
  .xp-bar-fill{height:100%;transition:width .6s ease;}
  .squad-actions{padding:14px 18px 14px 24px;border-bottom:1px solid var(--cod-border);}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .xp-action-btn{background:rgba(0,0,0,.4);border:1px solid var(--cod-border);color:var(--text-main);font-family:'Rajdhani',sans-serif;
    font-size:12px;font-weight:600;padding:8px 10px;cursor:pointer;text-align:left;transition:all .2s;display:flex;justify-content:space-between;align-items:center;}
  .xp-action-btn:hover{border-color:var(--squad-color);background:rgba(255,255,255,.05);color:var(--squad-color);}
  .xp-action-btn .xp-val{color:var(--squad-color);font-family:'Orbitron',monospace;font-size:11px;}
  .custom-xp-row{margin-top:8px;display:flex;gap:8px;}
  .custom-xp-input{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--cod-border);color:var(--text-main);
    font-family:'Rajdhani',sans-serif;font-size:13px;padding:7px 10px;outline:none;transition:border-color .2s;}
  .custom-xp-input:focus{border-color:var(--squad-color);}
  .custom-xp-input::placeholder{color:var(--text-muted);}
  .add-xp-btn{border:none;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;padding:7px 14px;cursor:pointer;letter-spacing:1px;transition:opacity .2s;}
  .add-xp-btn:hover{opacity:.85;}
  .squad-medals{padding:14px 18px 14px 24px;}
  .medals-label{font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
  .medals-row{display:flex;gap:10px;flex-wrap:wrap;}
  .medal-slot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .2s;}
  .medal-slot:hover{transform:scale(1.08);}
  .medal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid transparent;transition:all .2s;}
  .medal-icon.unlocked{border-color:var(--squad-color);box-shadow:0 0 10px var(--squad-color);}
  .medal-icon.locked{filter:grayscale(1);opacity:.3;border-color:var(--cod-border);}
  .medal-name{font-size:9px;color:var(--text-muted);text-align:center;max-width:50px;line-height:1.2;}
  .medal-name.unlocked-text{color:var(--squad-color);}
  .leaderboard-wrap{margin-bottom:32px;}
  .leaderboard-table{width:100%;border-collapse:collapse;}
  .leaderboard-table th{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:2px;
    text-transform:uppercase;padding:10px 16px;text-align:left;background:rgba(0,0,0,.3);border-bottom:1px solid var(--cod-border);}
  .leaderboard-table td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px;font-weight:600;}
  .lb-rank{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--text-muted);width:40px;}
  .lb-squad-name{font-family:'Orbitron',monospace;font-size:13px;}
  .lb-bar-bg{height:4px;background:rgba(255,255,255,.06);}
  .lb-bar-fill{height:4px;transition:width .6s ease;}
  .lb-xp{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;text-align:right;}
  .controls-bar{display:flex;gap:12px;justify-content:flex-end;margin-bottom:24px;}
  .ctrl-btn{background:transparent;border:1px solid var(--cod-border);color:var(--text-muted);font-family:'Rajdhani',sans-serif;
    font-size:12px;font-weight:600;padding:8px 18px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all .2s;}
  .ctrl-btn.danger{border-color:var(--dhl-red);color:var(--dhl-red);}
  .ctrl-btn.danger:hover{background:var(--dhl-red);color:#fff;}
  #toast{position:fixed;bottom:30px;right:30px;background:var(--cod-panel);border-left:3px solid var(--dhl-yellow);
    padding:12px 20px;font-size:13px;font-weight:600;letter-spacing:1px;opacity:0;transform:translateY(20px);
    transition:all .3s;z-index:999;pointer-events:none;max-width:300px;}
  #toast.show{opacity:1;transform:translateY(0);}
  .firebase-status{font-size:10px;letter-spacing:2px;margin-top:4px;}
  ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--cod-dark);}::-webkit-scrollbar-thumb{background:var(--cod-border);}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="dhl-badge">DHL</div>
    <div>
      <div class="op-title">OPERATION ALPHA</div>
      <div class="op-subtitle">Manager Dashboard · Live Sync</div>
    </div>
  </div>
  <div style="text-align:right;">
    <div class="mission-status">MISSION ACTIVE</div>
    <div class="firebase-status" id="syncStatus" style="color:#888;">⏳ Connecting...</div>
  </div>
</header>

<div class="gif-hero">
  <img src="Untitled_design.gif" alt="Operation Alpha"/>
  <div class="gif-hero-overlay"></div>
  <div class="gif-hero-tag">⚡ MISSION ACTIVE</div>
</div>

<main>
  <div class="controls-bar">
    <button class="ctrl-btn danger" onclick="confirmReset()">🔄 Reset Campaign</button>
  </div>
  <div class="section-title">⚔ Squad Command Centers</div>
  <div class="squads-grid" id="squadsGrid"></div>
  <div class="leaderboard-wrap">
    <div class="section-title">🏆 Tactical Leaderboard</div>
    <div style="background:var(--cod-panel);border:1px solid var(--cod-border);">
      <table class="leaderboard-table">
        <thead><tr>
          <th>#</th><th>Squad</th><th style="width:200px">XP Progress</th>
          <th style="text-align:right">Total XP</th><th>Rank</th><th>Medals</th>
        </tr></thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast"><span id="toastIcon"></span> <span id="toastMsg"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyANLBion38r3RMLcizLYzM-GKpbCvkSKZw",
  authDomain: "cs-operation-alpha.firebaseapp.com",
  databaseURL: "https://cs-operation-alpha-default-rtdb.firebaseio.com",
  projectId: "cs-operation-alpha",
  storageBucket: "cs-operation-alpha.firebasestorage.app",
  messagingSenderId: "599142962917",
  appId: "1:599142962917:web:0776080960cf3bfa5d260c"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db, 'squads');

const SQUADS = [
  {id:'alpha',  name:'SQUAD ALPHA',  sub:'EXPRESS',   motto:'"Speed Wins Wars"',               color:'#FFCC00', emoji:'⚡'},
  {id:'bravo',  name:'SQUAD BRAVO',  sub:'LIGHTNING', motto:'"Strike Fast, Strike Hard"',       color:'#00BFFF', emoji:'🌩'},
  {id:'charlie',name:'SQUAD CHARLIE',sub:'AIRBORNE',  motto:'"Sky\'s the Limit"',              color:'#39FF14', emoji:'🦅'},
  {id:'delta',  name:'SQUAD DELTA',  sub:'FALCON',    motto:'"Precision. Execution. Victory."', color:'#FF4500', emoji:'🎯'},
];
const RANKS = [
  {min:0,   max:100, name:'RECRUIT'},
  {min:101, max:250, name:'SPECIALIST'},
  {min:251, max:500, name:'CORPORAL'},
  {min:501, max:750, name:'SERGEANT'},
  {min:751, max:1000,name:'LIEUTENANT'},
  {min:1001,max:Infinity,name:'COMMANDER'},
];
const MEDALS = [
  {id:'firstBlood', name:'FIRST BLOOD',   icon:'🩸'},
  {id:'upsellNinja',name:'UPSELL NINJA',  icon:'🥷'},
  {id:'rapidFire',  name:'RAPID FIRE',    icon:'🔥'},
  {id:'hearts',     name:'HEARTS & MINDS',icon:'💛'},
  {id:'juggernaut', name:'JUGGERNAUT',    icon:'💪'},
];
const ACTIONS = [
  {label:'New Sale Lead',          xp:10},
  {label:'Upsell to Express',      xp:15},
  {label:'Insurance Upgrade',      xp:20},
  {label:'Combo Bonus (5+ Same Day)',xp:20},
  {label:'First Blood Bonus',      xp:5},
  {label:'UAV – Heavy 30kg+',      xp:200},
  {label:'High-Value Target 50kg+',xp:200},
  {label:'Care Package',           xp:50},
];

let STATE = {};
function defaultState() {
  const s = {};
  SQUADS.forEach(sq => { s[sq.id] = {xp:0, medals:{}}; MEDALS.forEach(m => s[sq.id].medals[m.id]=false); });
  return s;
}

function saveState() { set(dbRef, STATE); }
function getRank(xp) { return RANKS.find(r => xp>=r.min && xp<=r.max) || RANKS[RANKS.length-1]; }
function getProgress(xp) { const r=getRank(xp); if(r.max===Infinity)return 100; return Math.min(100,Math.round(((xp-r.min)/(r.max-r.min))*100)); }

function showToast(icon, msg, color='#FFCC00') {
  const t=document.getElementById('toast');
  t.style.borderLeftColor=color;
  document.getElementById('toastIcon').textContent=icon;
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

window.addXP = function(id, amt, label) {
  if(!STATE[id]) STATE[id]=defaultState()[id];
  STATE[id].xp += amt;
  saveState();
  const sq=SQUADS.find(s=>s.id===id);
  showToast('⚡', `${sq.name}: +${amt} XP — ${label}`, sq.color);
};

window.deductXP = function(id) {
  const input=document.getElementById('custom_'+id);
  const val=parseInt(input.value);
  if(!val||val<=0){showToast('⚠️','Enter a valid amount','#FF4500');return;}
  if(!STATE[id]) STATE[id]=defaultState()[id];
  const before=STATE[id].xp;
  STATE[id].xp=Math.max(0,before-val);
  saveState();
  const sq=SQUADS.find(s=>s.id===id);
  showToast('↩️',`${sq.name}: −${before-STATE[id].xp} XP removed`,'#FF4500');
  input.value='';
};

window.addCustomXP = function(id) {
  const input=document.getElementById('custom_'+id);
  const val=parseInt(input.value);
  if(!val||val<=0){showToast('⚠️','Enter a valid amount','#FF4500');return;}
  addXP(id, val, 'Manual Entry');
  input.value='';
};

window.toggleMedal = function(id, mid) {
  if(!STATE[id]) STATE[id]=defaultState()[id];
  STATE[id].medals[mid]=!STATE[id].medals[mid];
  saveState();
  const sq=SQUADS.find(s=>s.id===id);
  const md=MEDALS.find(m=>m.id===mid);
  showToast(STATE[id].medals[mid]?md.icon:'🔒', STATE[id].medals[mid]?`${sq.name} earned: ${md.name}!`:`${md.name} removed`, STATE[id].medals[mid]?sq.color:'#888');
};

window.confirmReset = function() {
  if(confirm('⚠️ RESET ALL SQUAD DATA?\n\nThis clears all XP and medals. Cannot be undone.\n\nProceed?')){
    STATE=defaultState();
    saveState();
    showToast('🔄','Campaign reset!','#FF4500');
  }
};

function renderSquads() {
  document.getElementById('squadsGrid').innerHTML = SQUADS.map(sq => {
    const s = STATE[sq.id] || defaultState()[sq.id];
    const rank = getRank(s.xp);
    const prog = getProgress(s.xp);
    const nextXP = rank.max===Infinity ? '—' : rank.max+' XP';
    const actions = ACTIONS.map(a=>`
      <button class="xp-action-btn" onclick="addXP('${sq.id}',${a.xp},'${a.label}')">
        <span>${a.label}</span><span class="xp-val">+${a.xp}</span>
      </button>`).join('');
    const medals = MEDALS.map(m=>{
      const on=s.medals[m.id];
      return `<div class="medal-slot" onclick="toggleMedal('${sq.id}','${m.id}')" title="${m.name}">
        <div class="medal-icon ${on?'unlocked':'locked'}">${m.icon}</div>
        <div class="medal-name ${on?'unlocked-text':''}">${m.name}</div>
      </div>`;
    }).join('');
    return `<div class="squad-card" style="--squad-color:${sq.color}">
      <div class="squad-header">
        <div><div class="squad-label">Squad · ${sq.sub}</div>
          <div class="squad-name">${sq.emoji} ${sq.name}</div>
          <div class="squad-motto">${sq.motto}</div></div>
        <div class="squad-rank-badge"><div class="rank-label">Rank</div><div class="rank-name">${rank.name}</div></div>
      </div>
      <div class="squad-xp-area">
        <div class="xp-row">
          <div><span class="xp-total">${s.xp.toLocaleString()}</span><span class="xp-unit">XP</span></div>
          <div class="xp-next">Next: ${nextXP}</div>
        </div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${prog}%;background:${sq.color};box-shadow:0 0 8px ${sq.color}"></div></div>
      </div>
      <div class="squad-actions">
        <div style="font-size:10px;color:var(--text-muted);letter-spacing:2px;margin-bottom:8px;">QUICK ADD XP</div>
        <div class="action-grid">${actions}</div>
        <div class="custom-xp-row">
          <input class="custom-xp-input" type="number" id="custom_${sq.id}" placeholder="XP amount..." min="1">
          <button class="add-xp-btn" style="background:${sq.color};color:#000" onclick="addCustomXP('${sq.id}')">+ ADD</button>
          <button class="add-xp-btn" style="background:transparent;color:#FF4500;border:1px solid #FF4500" onclick="deductXP('${sq.id}')">− DEDUCT</button>
        </div>
      </div>
      <div class="squad-medals">
        <div class="medals-label">🏅 Medals — click to award / revoke</div>
        <div class="medals-row">${medals}</div>
      </div>
    </div>`;
  }).join('');
}

function renderLeaderboard() {
  const sorted=[...SQUADS].sort((a,b)=>(STATE[b.id]?.xp||0)-(STATE[a.id]?.xp||0));
  const maxXP=Math.max(...sorted.map(s=>STATE[s.id]?.xp||0),1);
  const icons=['🥇','🥈','🥉','4'];
  document.getElementById('leaderboardBody').innerHTML=sorted.map((sq,i)=>{
    const xp=STATE[sq.id]?.xp||0;
    const rank=getRank(xp);
    const bar=Math.round((xp/maxXP)*100);
    const mIcons=MEDALS.filter(m=>STATE[sq.id]?.medals[m.id]).map(m=>m.icon).join(' ');
    return `<tr>
      <td class="lb-rank">${icons[i]||i+1}</td>
      <td><span class="lb-squad-name" style="color:${sq.color}">${sq.name}</span><br>
          <span style="font-size:11px;color:var(--text-muted)">${sq.sub}</span></td>
      <td><div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${bar}%;background:${sq.color};box-shadow:0 0 6px ${sq.color}"></div></div></td>
      <td class="lb-xp" style="color:${sq.color}">${xp.toLocaleString()}</td>
      <td style="font-size:11px;color:var(--text-muted)">${rank.name}</td>
      <td>${mIcons||'<span style="color:var(--text-muted);font-size:11px">—</span>'}</td>
    </tr>`;
  }).join('');
}

// Listen to Firebase — updates UI on every change
onValue(dbRef, (snapshot) => {
  const data = snapshot.val();
  STATE = data || defaultState();
  renderSquads();
  renderLeaderboard();
  document.getElementById('syncStatus').textContent = '🟢 LIVE SYNC ON';
  document.getElementById('syncStatus').style.color = '#39FF14';
});
</script>
</body>
</html>
